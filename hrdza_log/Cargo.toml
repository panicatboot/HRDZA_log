[package]
name = "hrdza_log"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio       = { version = "1", features = ["full"] }
ratatui     = "0.20"
crossterm   = "0.26"
notify      = "5"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1.0"
audit       = "0.7"
futures     = "0.3"
chrono      = { version = "0.4", features = ["serde", "clock"] }
genpdf      = "0.2.0"
udev        = "0.6"
skim        = "0.9"
x11rb       = "0.10"
rusqlite    = { version = "0.29", features = ["bundled", "chrono", "unlock_notify"] }
systemd     = { version = "0.8.0", features = ["journal"] }
dirs = "4"
